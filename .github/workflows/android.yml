name: Android APK + protocol tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check JavaScript and protocol
        run: |
          node --check app/src/main/assets/codec.js
          node --check app/src/main/assets/scanner.js
          node --check app/src/main/assets/recovery.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/gif.js
          node --test tests/*.test.cjs
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CodexAnim-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
